services:
  - type: web
    name: petuai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PETUAI_API_KEY
        generateValue: true
      - key: PETUAI_OWNER_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: PETUAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
