services:
  - type: web
    name: petuai
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PETUAI_API_KEY
        generateValue: true
      - key: PETUAI_OWNER_KEY
        generateValue: true
      - key: HF_TOKEN
        sync: false
      - key: PETUAI_IMAGE_MODEL
        value: black-forest-labs/FLUX.1-schnell
